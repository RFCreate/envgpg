name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Bats Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0
      - name: Run Bats tests
        run: bats tests/envgpg.bats
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run ShellCheck
        run: shellcheck envgpg.sh
